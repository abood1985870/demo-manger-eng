version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=testing
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=testing_db
      - DB_USERNAME=testuser
      - DB_PASSWORD=testpass
      - CACHE_DRIVER=array
      - QUEUE_CONNECTION=sync
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=testing_db
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testing_db"]
      interval: 2s
      timeout: 5s
      retries: 10
