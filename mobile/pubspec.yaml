name: enterprise_legal_mobile
description: "Saudi Law Firm Edition Enterprise Mobile Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & DI
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  
  # Networking
  dio: ^5.4.2
  
  # Secure Storage (Crucial for STEP L8)
  flutter_secure_storage: ^9.0.0
  
  # Routing & Deep Linking
  go_router: ^13.2.0

  # Localization & Icons
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
