services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the server environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the service}
      REQUIRE_SECURE_COOKIES: ${REQUIRE_SECURE_COOKIES:-true}
      DOCUMENT_STORAGE_PATH: /data/legal-documents
    volumes:
      - app-documents:/data/legal-documents
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the server environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server environment}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the server environment}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  app-documents:
  db-data:
